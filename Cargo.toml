[package]
name = "osechi"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.34.2"
nokhwa = { version = "0.10", features = ["input-native"] }
image = "0.25.10"
cpal = "0.17.3"
xcap = "0.7"

#ログ関連
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# ネットワーク(AES67のマルチキャスト受信)関連
if-addrs = "0.15.0"

# 外部API(donguri等からのミュートAPI等)関連
axum = { version = "0.8.9", features = ["json"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
utoipa = { version = "5.5.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

# 番組出力(RTMP配信・録画)関連。エンコーダはソースからビルドして組み込み、ffmpeg等の外部ツールに頼らない。
openh264 = "0.9.8"
fdk-aac = "0.8.0"
rml_rtmp = "0.8.0"
bytes = "1"
# 録画ファイル名に現地時刻を入れる
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

# 開発ビルド: 依存クレートだけ最適化し、自分のクレートはビルド速度を優先する。
# (開発ビルドのコード生成バックエンドの指定は nightly 専用なので .cargo/config.toml にある。
#  このファイルは安定版のCargoでも読めるように保つ。)
[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# リリースビルド: 実行速度を最優先に最適化する。安定版のRust(LLVM)でビルドする。
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
serde_json = "1.0.151"
tower = { version = "0.5.3", features = ["util"] }
