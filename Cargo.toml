[package]
name = "osechi"
version = "0.0.1"
edition = "2024"

[dependencies]
eframe = "0.34.2"
rayon = "1.1"
nokhwa = { version = "0.10", features = ["input-native"] }
num_cpus = "1.16"
rfd = "0.17.2"
chrono = "0.4.44"
openh264 = "0.9.3"
mp4 = "0.14.0"
image = "0.25.10"

#ログ関連
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["precommit-hook","run-cargo-fmt"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 'z'
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
