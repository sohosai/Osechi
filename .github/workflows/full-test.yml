name: Full Test

on:
  workflow_dispatch:

jobs:
  full-validation:
    name: Full Validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Release Build
        run: cargo build --release --all-features

      - name: Run Tests
        run: cargo test --release --all-targets --all-features

      - name: Clippy
        run: cargo clippy --release --all-targets --all-features -- -D warnings
