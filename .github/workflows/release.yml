name: Release Build

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "バージョンの更新桁 (major, minor, patch)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Bump Version
        id: bump
        run: |
          cargo set-version --bump ${{ inputs.bump }}
          NEW_VERSION=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[0].version')
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to v${{ steps.bump.outputs.new_version }}"
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin HEAD --tags

  release-build:
    name: Build Release (${{ matrix.os }})
    needs: bump-version
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        include:
          - os: ubuntu-latest
            artifact_name: Osechi-Linux
            bin_path: target/release/Osechi
            release_name: Osechi-Linux
          - os: windows-latest
            artifact_name: Osechi-Windows
            bin_path: target/release/Osechi.exe
            release_name: Osechi-Windows.exe
          - os: macos-latest
            artifact_name: Osechi-macOS
            bin_path: target/release/Osechi
            release_name: Osechi-macOS

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }} # バージョン更新後の最新コミットを取得するためにブランチ名を指定

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release
        run: cargo build --release

      - name: Rename Binary
        shell: bash
        run: mv ${{ matrix.bin_path }} ${{ matrix.release_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.release_name }}

  create-release:
    name: Create GitHub Release
    needs: [bump-version, release-build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.bump-version.outputs.new_version }}
          generate_release_notes: true
          files: |
            artifacts/Osechi-Linux/Osechi-Linux
            artifacts/Osechi-Windows/Osechi-Windows.exe
            artifacts/Osechi-macOS/Osechi-macOS
